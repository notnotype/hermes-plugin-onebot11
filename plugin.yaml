name: onebot11-platform
label: OneBot 11 (QQ)
kind: platform
version: 0.3.1
description: >
  OneBot 11 (QQ) gateway adapter for Hermes Agent.
  Reverse WebSocket + HTTP API. Shared group sessions, durable queued context,
  layered triggers, active conversation windows, scoped query tools and
  confirmed group-management actions.
author: notnotype
requires_env: []
optional_env:
  - name: ONEBOT11_HTTP_API
    description: "QQ 框架的 OneBot 11 HTTP API 地址；也可写入 platforms.onebot11.extra.http_api"
    prompt: "OneBot 11 HTTP API 地址"
    password: false
  - name: ONEBOT11_SELF_ID
    description: "机器人 QQ 号（用于识别群里的 @）；也可写入 platforms.onebot11.extra.self_id"
    prompt: "机器人 QQ 号"
    password: false
  - name: ONEBOT11_WS_PORT
    description: "反向 WS 监听端口 (默认 18880)"
    prompt: "反向 WS 端口"
    password: false
  - name: ONEBOT11_ACCESS_TOKEN
    description: "WS/HTTP 的 Bearer token，与 QQ 框架侧一致"
    prompt: "访问 token"
    password: true
  - name: ONEBOT11_WS_HOST
    description: "反向 WS 监听地址；非 loopback 地址必须配置 token"
    prompt: "反向 WS 监听地址"
    password: false
  - name: ONEBOT11_DM_POLICY
    description: "私聊策略: open / allowlist / disabled"
    prompt: "私聊策略"
    password: false
  - name: ONEBOT11_ALLOWED_USERS
    description: "私聊白名单（逗号分隔的 QQ 号）"
    prompt: "私聊白名单"
    password: false
  - name: ONEBOT11_ALLOWED_GROUPS
    description: "群白名单（逗号分隔的群号；空 = 所有群可用）"
    prompt: "群白名单"
    password: false
  - name: ONEBOT11_REQUIRE_MENTION
    description: "群聊是否必须 @ 机器人 才创建 trigger；未触发消息仍进入队列（默认 true）"
    prompt: "群聊 @ 触发"
    password: false
  - name: ONEBOT11_SUPER_ADMINS
    description: "超级管理员 QQ 列表（逗号分隔；空 = 写操作 fail-closed）"
    prompt: "超级管理员 QQ 列表"
    password: false
  - name: ONEBOT11_ADMINS
    description: "ONEBOT11_SUPER_ADMINS 的兼容旧名"
    prompt: "旧版管理员 QQ 列表"
    password: false
  - name: ONEBOT11_ALLOW_ALL_USERS
    description: "明确允许 dm_policy=open 的私聊；不设置时 open 仍 fail-closed"
    prompt: "允许开放私聊"
    password: false
  - name: ONEBOT11_QUEUE_DB
    description: "持久 SQLite 队列路径；空 = 使用 Hermes home 下的默认路径"
    prompt: "队列数据库路径"
    password: false
  - name: ONEBOT11_HOME_CHANNEL
    description: "定时任务默认投递目标（群号或 QQ 号；必须额外配置 extra.home_channel_type=group|dm）"
    prompt: "默认投递目标"
    password: false
