[project]
name = "hermes-onebot11"
version = "0.5.0"
description = "OneBot 11 (QQ) platform adapter plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "notnotype" }]
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["adapter"]

[tool.setuptools.packages.find]
include = ["onebot11*"]
exclude = ["tests*", "spikes*", ".agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# 仓库根即插件目录(含 __init__.py);importlib 模式按文件路径导入测试,
# 避免 pytest 按目录名把根包当测试模块导入(CI 检出目录名含连字符会炸)
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
